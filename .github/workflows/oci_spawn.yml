name: OCI Provisioner

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/oci_spawn.yml' ]

# Safety net: agar kabhi run overlap ho, nayi run purani ko cancel kar de
concurrency:
  group: oci-provision
  cancel-in-progress: true

permissions:
  actions: write          # github.token se workflow disable karne ke liye

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run provisioner
        env:
          OCI_TENANCY_ID:     ${{ secrets.OCI_TENANCY_ID }}
          OCI_USER_ID:        ${{ secrets.OCI_USER_ID }}
          OCI_REGION:         ${{ secrets.OCI_REGION }}
          OCI_FINGERPRINT:    ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY:    ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_SUBNET_ID:      ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID:       ${{ secrets.OCI_IMAGE_ID }}
          OCI_PUBLIC_SSH_KEY: ${{ secrets.OCI_PUBLIC_SSH_KEY }}
          OCI_STACK_ID:       ${{ secrets.OCI_STACK_ID }}
          BOT_TOKEN:          ${{ secrets.BOT_TOKEN }}
          TELEGRAM_UID:       ${{ secrets.TELEGRAM_UID }}
          GH_TOKEN:           ${{ github.token }}
          WORKFLOW_PATH:      '.github/workflows/oci_spawn.yml'
          OCPUS:              '2'
          MEMORY_GB:          '12'
          BOOT_VOLUME_GB:     '150'
          MAX_ATTEMPTS:       '18'
          WAIT_MIN:           '85'
          WAIT_MAX:           '95'
        run: python bot.py
